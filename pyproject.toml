[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "plant-hsi-studio"
version = "0.1.0"
description = "Plant Hyperspectral Imaging Studio — a desktop tool for plant disease detection with hyperspectral imagery."
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = { text = "Apache-2.0" }
authors = [{ name = "PHS Team" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
]
dependencies = [
    "PySide6>=6.6",
    "numpy>=1.26",
    "scipy>=1.11",
    "xarray>=2023.9",
    "pandas>=2.1",
    "pyarrow>=14.0",
    "sqlmodel>=0.0.16",
]

[project.optional-dependencies]
io = [
    "rasterio>=1.3",
    "tifffile>=2023.9",
    "spectral>=0.22",
    "zarr>=2.16",
]
ml = [
    "scikit-learn>=1.3",
    "statsmodels>=0.14",
]
dl = [
    "torch>=2.1",
]
dev = [
    "pytest>=7",
    "pytest-qt>=4",
    "ruff>=0.1",
    "mypy>=1.7",
    "pre-commit>=3",
]

[project.scripts]
phs = "plant_hsi.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["SIM"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = [
    "PySide6.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "h5py",
    "scipy",
    "scipy.*",
    "numcodecs",
    "spectral",
    "spectral.*",
    "tifffile",
    "zarr",
    "zarr.*",
    "matplotlib",
    "matplotlib.*",
    "PIL",
    "PIL.*",
    "pandas",
    "cv2",
    "sklearn.*",
    "joblib",
    "torch",
    "torch.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra -q"
